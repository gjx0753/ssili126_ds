name: itvlist

on:
  schedule:
    - cron: '0 21 * * *'  # UTC时间21:00运行
  workflow_dispatch:     # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 授予写入仓库的权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
    
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # 启用 pip 缓存，加速依赖安装

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行生成脚本
        run: python ${{ github.workspace }}/new.py
      
      - name: 提交更改
        run: |
          git config --local user.email "ssili@126.com"
          git config --local user.name "ssili126"
          git add .
          git diff --staged --quiet || git commit -m "自动更新: 更新生成的列表文件 [skip ci]"
          git push
